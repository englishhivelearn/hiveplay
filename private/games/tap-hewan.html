<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap the Animals · Hive Play</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hive.css"></head><body>
<div class="top"><a class="back" href="/">← Back</a></div>
<main>
<h1 class="rise">Tap the Animals</h1>
<p class="sub rise" style="--i:1">Tap an animal to hear its name and its sound!</p>
<section class="stage rise" style="--i:2"><div class="zoo" id="zoo"></div><div class="nm" id="nm" aria-live="polite"></div><div class="hint" id="snd" style="min-height:1.5em"></div></section></main>
<script src="/art.js"></script>
<script>const ZOO=[['dog','Dog','Woof woof!'],['cat','Cat','Meow!'],['cow','Cow','Moo!'],['frog','Frog','Ribbit!']];
const nm=document.getElementById('nm'),zoo=document.getElementById('zoo'),snd=document.getElementById('snd');
ZOO.forEach(([k,n,so],i)=>{
  const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label',n);b.innerHTML=ART[k];
  b.querySelector('.pet').style.setProperty('--i',i);
  b.onanimationend=e=>{if(e.animationName==='squash')b.classList.remove('tap')};
  b.onclick=()=>{
    b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap');
    nm.textContent='';[...n].forEach((c,j)=>{const s=document.createElement('span');s.textContent=c;s.style.setProperty('--k',j);nm.appendChild(s)});
    snd.textContent=so;
    if(window.HP){HP.pop();HP.say(n+'. '+so);HP.spark(b)}
  };
  zoo.appendChild(b);
});</script>
<script src="/hive.js" defer></script></body></html>
