<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Vocabulary · Hive Play</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hive.css">
<style>
.fv-ctl{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:center;margin:0 0 12px}
.fv-grp{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:15px}
.fv-seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fv-seg button{border:0;background:var(--card);color:var(--ink);padding:7px 13px;font:inherit;cursor:pointer}
.fv-seg button.on{background:linear-gradient(100deg,var(--b1),var(--b2));color:#fff}
.fv-grp label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.fv-wrap{max-width:1100px;margin:0 auto;background:var(--bg)}
.fv-bar{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:10px 18px;border-radius:20px 20px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0}
.fv-prompt{font-family:Fredoka,sans-serif;font-size:clamp(22px,4vw,36px);font-weight:700;line-height:1.2}
.fv-prompt b{color:var(--b2)}
.fv-stats{display:flex;gap:16px;color:var(--mute);font-size:16px;flex-wrap:wrap}
.fv-stats b{color:var(--ink);font-family:Fredoka,sans-serif}
.fv-stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:0 0 22px 22px;border:1px solid var(--line);background:radial-gradient(circle at 30% 25%,#2d3175,#14173a 72%);cursor:none;touch-action:none;user-select:none;-webkit-user-select:none;--x:50%;--y:50%;--r:140px;--u:5px}
.fv-stage:focus-visible{outline:3px solid var(--b4);outline-offset:3px}
.fv-items{position:absolute;inset:0}
.fv-item{position:absolute;width:calc(var(--u)*17);height:calc(var(--u)*17);transform:translate(-50%,-50%);display:grid;place-items:center}
.fv-item svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.fv-item.found{z-index:7}
.fv-item.found svg{filter:drop-shadow(0 0 14px #ffe28a)}
.fv-item.found::before{content:"";position:absolute;inset:-5%;border-radius:50%;border:4px solid var(--b4);box-shadow:0 0 18px var(--b4);animation:fvpop .5s var(--ease)}
.fv-item.found::after{content:"\2713";position:absolute;right:-2%;top:-2%;width:30%;height:30%;display:grid;place-items:center;border-radius:50%;background:var(--b4);color:#06281d;font-weight:700;font-size:calc(var(--u)*3.4)}
.fv-item.shake{animation:fvshake .4s}
.fv-cap{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;padding:1px 14px;border-radius:99px;background:#fff;color:#1a1b4b;font-family:Fredoka,sans-serif;font-weight:700;font-size:max(13px,calc(var(--u)*3.2));white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.fv-dark{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity 1.1s;background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(4,5,24,0) 0,rgba(4,5,24,0) 52%,rgba(4,5,24,.8) 78%,rgba(4,5,24,.985) 100%)}
.fv-stage.lit .fv-dark{opacity:0}
.fv-stage.lit .fv-lamp{opacity:0}
.fv-lamp{position:absolute;z-index:6;pointer-events:none;left:var(--x);top:var(--y);width:calc(var(--r)*2);height:calc(var(--r)*2);transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;transition:opacity .6s;background:radial-gradient(circle,rgba(255,226,138,.34) 0,rgba(255,226,138,.15) 45%,transparent 70%)}
.fv-lamp::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:#fff6c8;box-shadow:0 0 18px 8px rgba(255,226,138,.9)}
.fv-ring{position:absolute;z-index:8;border-radius:50%;pointer-events:none;border:4px solid #ffe28a;box-shadow:0 0 22px #ffe28a;transform:translate(-50%,-50%);animation:fvring 1.5s ease-out forwards}
.fv-start{position:absolute;inset:0;z-index:9;display:grid;place-items:center;text-align:center;padding:0 24px;pointer-events:none;color:#fff;font-family:Fredoka,sans-serif;font-size:clamp(20px,3.2vw,32px);text-shadow:0 2px 14px #000;transition:opacity .6s}
.fv-start.gone{opacity:0}
.fv-win{position:absolute;inset:0;z-index:10;display:grid;place-items:center;text-align:center;cursor:default;background:rgba(10,12,40,.5);color:#fff;padding:16px;animation:fvfade .8s both}
.fv-win[hidden]{display:none}
.fv-win h2{margin:0 0 6px;font-family:Fredoka,sans-serif;font-size:clamp(28px,5vw,48px)}
.fv-win p{margin:0 0 14px;font-size:clamp(16px,2.4vw,22px)}
.fv-msg{min-height:1.6em;text-align:center;font-family:Fredoka,sans-serif;font-size:20px;color:var(--b1);margin:10px 0 0}
.fv-wrap:fullscreen{max-width:none;width:100vw;height:100vh;display:flex;flex-direction:column;padding:10px}
.fv-wrap:fullscreen .fv-stage{aspect-ratio:auto;flex:1;min-height:0}
.fv-wrap:-webkit-full-screen{max-width:none;width:100vw;height:100vh;display:flex;flex-direction:column;padding:10px}
.fv-wrap:-webkit-full-screen .fv-stage{aspect-ratio:auto;flex:1;min-height:0}
@keyframes fvshake{25%{transform:translate(-50%,-50%) translateX(-10px)}75%{transform:translate(-50%,-50%) translateX(10px)}}
@keyframes fvpop{from{transform:scale(.5);opacity:0}}
@keyframes fvring{from{width:calc(var(--u)*8);height:calc(var(--u)*8);opacity:1}to{width:calc(var(--u)*30);height:calc(var(--u)*30);opacity:0}}
@keyframes fvfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.fv-dark,.fv-lamp,.fv-start{transition:none}}
</style></head>
<body>
<div class="top"><a class="back" href="/">← Back</a></div>
<main>
<h1 class="rise">Find the Vocabulary</h1>
<p class="sub rise" style="--i:1">The lights are out! Move the light to look around, then click the picture you hear or see on the screen.</p>
<div class="hv-bar"><div id="picker"></div><div id="note" class="hv-note" hidden></div></div>

<div class="fv-ctl rise" style="--i:2">
  <div class="fv-grp">Pictures <span class="fv-seg" id="segCount" role="group" aria-label="Number of pictures"><button data-v="4">4</button><button data-v="6">6</button><button data-v="8">8</button><button data-v="10">10</button></span></div>
  <div class="fv-grp">Light <span class="fv-seg" id="segLight" role="group" aria-label="Light size"><button data-v="small">Small</button><button data-v="medium">Medium</button><button data-v="large">Large</button></span></div>
  <div class="fv-grp"><label><input type="checkbox" id="showWord" checked> Show the word</label></div>
  <button class="btn sm alt" id="again">Hear it again</button>
  <button class="btn sm alt" id="hint">Hint</button>
  <button class="btn sm alt" id="newgame">New game</button>
  <button class="btn sm alt" id="full" hidden>Fullscreen</button>
</div>

<section class="fv-wrap" id="wrap">
  <div class="fv-bar">
    <div class="fv-prompt" id="prompt" aria-live="polite">Loading…</div>
    <div class="fv-stats"><span>Found <b id="found">0</b>/<b id="total">0</b></span><span>Time <b id="time">0:00</b></span><span>Mistakes <b id="miss">0</b></span></div>
  </div>
  <div class="fv-stage" id="stage" tabindex="0" aria-label="Dark room. Move the mouse or finger to move the light. Arrow keys also move the light. Press Enter to pick the picture under the light.">
    <div class="fv-items" id="items"></div>
    <div class="fv-dark" id="dark"></div>
    <div class="fv-lamp" id="lamp"></div>
    <div class="fv-start" id="start">Move the light to look around…</div>
    <div class="fv-win" id="win" hidden><div><h2>The lights are on!</h2><p id="winText"></p><button class="btn" id="playAgain">Play again</button></div></div>
  </div>
  <div class="fv-msg" id="msg" aria-live="polite"></div>
</section>
</main>
<script src="/art.js"></script>
<script src="/hive-vocab.js"></script>
<script>
const GAME = 'find-vocabulary';
/* Kata bawaan: dipakai hanya bila perpustakaan kosakata tidak tersedia. */
const FALLBACK = [
  { word: 'Dog', art: 'dog' }, { word: 'Cat', art: 'cat' }, { word: 'Cow', art: 'cow' }, { word: 'Frog', art: 'frog' },
  { word: 'Apple', art: 'apple' }, { word: 'Banana', art: 'banana' }, { word: 'Strawberry', art: 'strawberry' }, { word: 'Orange', art: 'orange' }, { word: 'Grape', art: 'grape' },
];
const LIGHT = { small: 0.14, medium: 0.2, large: 0.3 };
const ITEM = 17; /* ukuran gambar = 17% tinggi panggung */
const $ = (id) => document.getElementById(id);
const keyOf = (w) => w.slug || w.word.toLowerCase();
const shuffle = (a) => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
const fmt = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

const S = { words: [], imgs: {}, items: [], order: [], idx: 0, found: 0, mistakes: 0, t0: 0, timer: null, x: null, y: null, over: false, run: 0,
  count: 6, light: 'medium', show: true };
try { Object.assign(S, JSON.parse(localStorage.getItem('hp_fv') || '{}')); } catch (e) {}
if (![4, 6, 8, 10].includes(+S.count)) S.count = 6;
if (!LIGHT[S.light]) S.light = 'medium';
S.count = +S.count; S.show = S.show !== false;
const save = () => { try { localStorage.setItem('hp_fv', JSON.stringify({ count: S.count, light: S.light, show: S.show })); } catch (e) {} };

const stage = $('stage');
function size() { const r = stage.getBoundingClientRect(); return { w: r.width || 1000, h: r.height || 562, left: r.left || 0, top: r.top || 0 }; }
function layout() {
  const m = size(), st = stage.style;
  st.setProperty('--u', (m.h / 100) + 'px');
  st.setProperty('--r', (LIGHT[S.light] * m.h) + 'px');
  if (S.x === null) { S.x = m.w / 2; S.y = m.h / 2; }
  st.setProperty('--x', S.x + 'px'); st.setProperty('--y', S.y + 'px');
}
function moveLight(x, y) {
  const m = size();
  S.x = Math.max(0, Math.min(m.w, x)); S.y = Math.max(0, Math.min(m.h, y));
  stage.style.setProperty('--x', S.x + 'px'); stage.style.setProperty('--y', S.y + 'px');
  if (!S.over && S.items.length) {
    $('start').classList.add('gone');
    if (!S.t0) { S.t0 = Date.now(); S.timer = setInterval(() => { $('time').textContent = fmt(Date.now() - S.t0); }, 500); }
  }
}

/* Penempatan acak: tidak saling menimpa dan tidak keluar dari panggung. */
function place(n) {
  const m = size(), asp = m.w / m.h, mx = (ITEM / 2 + 3) / asp, my = ITEM / 2 + 3, bottom = 6; /* ruang untuk tulisan kata di bawah gambar */
  const pts = []; let minD = ITEM * 1.3;
  for (let i = 0; i < n; i++) {
    let p, tries = 0, ok = false;
    while (!ok) {
      p = { x: mx + Math.random() * (100 - 2 * mx), y: my + Math.random() * (100 - 2 * my - bottom) };
      ok = pts.every((q) => Math.hypot((p.x - q.x) * asp, p.y - q.y) >= minD);
      if (++tries > 300) { tries = 0; minD *= 0.92; }
    }
    pts.push(p);
  }
  return pts;
}

function target() { const i = S.order[S.idx]; return i === undefined ? null : S.items[i]; }
function speak(it) { if (it && window.HiveVocab) HiveVocab.say({ assets: it.w.assets }, it.w.word); }
function showPrompt() {
  const t = target();
  $('prompt').innerHTML = t ? (S.show ? 'Find: <b></b>' : 'Listen… find it!') : 'All found!';
  if (t && S.show) $('prompt').querySelector('b').textContent = t.w.word;
}
function stats() { $('found').textContent = S.found; $('total').textContent = S.items.length; $('miss').textContent = S.mistakes; }

function newGame() {
  clearInterval(S.timer); S.timer = null; S.t0 = 0; S.over = false; S.found = 0; S.mistakes = 0; S.idx = 0;
  stage.classList.remove('lit'); $('win').hidden = true; $('msg').textContent = ''; $('time').textContent = '0:00';
  $('items').textContent = '';
  const pool = S.words.filter((w) => S.imgs[keyOf(w)]);
  if (pool.length < 2) {
    S.items = []; S.order = []; stats();
    $('prompt').textContent = 'Not enough words with pictures';
    $('start').textContent = 'Choose another vocabulary set.'; $('start').classList.remove('gone'); return;
  }
  $('start').textContent = 'Move the light to look around…'; $('start').classList.remove('gone');
  const picked = shuffle(pool).slice(0, Math.min(S.count, pool.length)), pts = place(picked.length);
  layout();
  S.items = picked.map((w, i) => {
    const el = document.createElement('div'); el.className = 'fv-item'; el.innerHTML = S.imgs[keyOf(w)];
    el.style.left = pts[i].x + '%'; el.style.top = pts[i].y + '%'; el.setAttribute('role', 'img'); el.setAttribute('aria-label', w.word);
    $('items').appendChild(el);
    return { w, el, x: pts[i].x, y: pts[i].y, found: false };
  });
  S.order = shuffle(S.items.map((_, i) => i));
  stats(); showPrompt(); speak(target());
}

function choose(x, y) {
  if (S.over || !S.items.length) return;
  const m = size(), R = LIGHT[S.light] * m.h, hit = (ITEM / 100) * m.h * 0.6;
  let best = null, bd = Infinity;
  S.items.forEach((it) => {
    if (it.found) return;
    const d = Math.hypot(x - it.x / 100 * m.w, y - it.y / 100 * m.h);
    if (d <= hit && d <= R && d < bd) { best = it; bd = d; } /* harus terkena cahaya DAN tepat di gambar */
  });
  if (!best) return;
  const t = target();
  if (best === t) found(best); else wrong(best, t);
}
function found(it) {
  it.found = true; it.el.classList.add('found');
  const cap = document.createElement('div'); cap.className = 'fv-cap'; cap.textContent = it.w.word; it.el.appendChild(cap);
  S.found++; S.idx++; stats(); $('msg').textContent = '';
  if (window.HP) { HP.match(); HP.spark(it.el); }
  if (S.idx >= S.order.length) { setTimeout(win, 600); return; }
  showPrompt(); setTimeout(() => { if (!S.over) speak(target()); }, 700);
}
function wrong(it, t) {
  S.mistakes++; stats();
  it.el.classList.remove('shake'); void it.el.offsetWidth; it.el.classList.add('shake');
  $('msg').textContent = 'That is ' + it.w.word + '. ' + (S.show ? 'Find ' + t.w.word + '.' : 'Listen again and keep looking.');
  if (window.HP) HP.no();
}
function win() {
  S.over = true; clearInterval(S.timer);
  const ms = S.t0 ? Date.now() - S.t0 : 0;
  stage.classList.add('lit'); showPrompt();
  $('winText').textContent = 'You found all ' + S.items.length + ' words in ' + fmt(ms) + ' with ' + S.mistakes + (S.mistakes === 1 ? ' mistake.' : ' mistakes.');
  setTimeout(() => { $('win').hidden = false; }, 1100);
  if (window.HP) HP.win();
}
function hint() {
  const t = target(); if (!t || S.over) return;
  const ring = document.createElement('div'); ring.className = 'fv-ring'; ring.style.left = t.x + '%'; ring.style.top = t.y + '%';
  $('items').appendChild(ring); setTimeout(() => ring.remove(), 1600);
  if (window.HP) HP.tick(900);
}

/* Cursor = lampu. Mouse, sentuhan, dan tombol panah. */
const pos = (e) => { const m = size(); return [e.clientX - m.left, e.clientY - m.top]; };
stage.addEventListener('pointermove', (e) => { const [x, y] = pos(e); moveLight(x, y); });
stage.addEventListener('pointerdown', (e) => { const [x, y] = pos(e); moveLight(x, y); });
stage.addEventListener('click', (e) => { const [x, y] = pos(e); moveLight(x, y); choose(x, y); });
stage.addEventListener('keydown', (e) => {
  const m = size(), step = Math.min(m.w, m.h) * 0.04 * (e.shiftKey ? 3 : 1);
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (d) { e.preventDefault(); moveLight(S.x + d[0], S.y + d[1]); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(S.x, S.y); }
});

/* Kontrol */
function seg(id, key, parse) {
  const box = $(id);
  const paint = () => box.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(S[key]) === b.dataset.v));
  box.querySelectorAll('button').forEach((b) => { b.onclick = () => { S[key] = parse(b.dataset.v); save(); paint(); if (key === 'count') newGame(); else layout(); }; });
  paint();
}
seg('segCount', 'count', (v) => +v); seg('segLight', 'light', (v) => v);
$('showWord').checked = S.show;
$('showWord').onchange = (e) => { S.show = e.target.checked; save(); showPrompt(); };
$('again').onclick = () => speak(target());
$('hint').onclick = hint;
$('newgame').onclick = newGame;
$('playAgain').onclick = newGame;
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
  $('full').hidden = false;
  $('full').onclick = () => {
    const w = $('wrap');
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
  };
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) => document.addEventListener(ev, () => setTimeout(layout, 120)));
}
if (window.ResizeObserver) new ResizeObserver(layout).observe(stage); else window.addEventListener('resize', layout);

/* Kosakata dari perpustakaan pusat (dengan cadangan bawaan) */
async function mulai(setId) {
  const my = ++S.run;
  const res = await HiveVocab.load({ game: GAME, set: setId || '', fallback: FALLBACK, limit: 60 });
  const imgs = {};
  await Promise.all(res.words.map(async (w) => { imgs[keyOf(w)] = res.source === 'library' ? await HiveVocab.svg(w, ['whole', 'sliced', 'character']) : ART[w.art]; }));
  if (my !== S.run) return;
  S.words = res.words; S.imgs = imgs;
  const left = res.words.filter((w) => !imgs[keyOf(w)]), msg = [];
  if (res.source === 'builtin') msg.push('The vocabulary library is not available, so built-in words are being used.');
  if (left.length) msg.push(left.length + (left.length === 1 ? ' word has' : ' words have') + ' no picture and ' + (left.length === 1 ? 'is' : 'are') + ' left out of this game (' + left.slice(0, 6).map((w) => w.word).join(', ') + (left.length > 6 ? ', …' : '') + ').');
  $('note').hidden = !msg.length; $('note').textContent = msg.length ? '⚠ ' + msg.join(' ') : '';
  newGame();
}
layout();
HiveVocab.picker($('picker'), { game: GAME, onChange: mulai }).then(mulai);
</script>
<script src="/hive.js" defer></script></body></html>
