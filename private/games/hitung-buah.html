<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitung Buah</title><link rel="stylesheet" href="../style.css"></head>
<body><div class="top"><a href="/">← Kembali</a></div>
<div class="wrap"><h1>Ada berapa?</h1>
<div id="b" style="font-size:clamp(44px,12vw,80px);line-height:1.3;min-height:2.6em"></div>
<div class="opts" id="o"></div><div class="msg" id="m"></div>
<p id="s" style="color:var(--mute)"></p></div>
<script>
const E=["🍎","🍌","🍓","🍊","🍇"];let n=0,skor=0,ronde=0;
function bicara(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";speechSynthesis.speak(u)}catch(e){}}
function baru(){
  n=1+Math.floor(Math.random()*10);const e=E[Math.floor(Math.random()*E.length)];
  b.textContent=e.repeat(n);m.textContent="";
  let p=new Set([n]);while(p.size<3)p.add(1+Math.floor(Math.random()*10));
  o.innerHTML="";[...p].sort(()=>Math.random()-.5).forEach(v=>{
    const x=document.createElement("button");x.className="opt";x.textContent=v;
    x.onclick=()=>{ronde++;if(v===n){skor++;m.textContent="⭐ Pintar! "+n;bicara(String(n));setTimeout(baru,1300)}else{m.textContent="Coba lagi ya 🙂";x.style.opacity=.3}};
    o.appendChild(x)});
  s.textContent="Bintang: "+skor;
}
baru();
</script></body></html>
