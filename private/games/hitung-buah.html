<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitung Buah · Hive Play</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hive.css"></head><body>
<div class="top"><a class="back" href="/">← Kembali</a></div>
<main>
<h1 class="rise">Ada berapa?</h1>
<p class="sub rise" style="--i:1">Hitung buahnya, lalu pilih angka yang benar.</p>
<section class="stage rise" style="--i:2"><div class="fruits" id="b"></div><div class="opts" id="o"></div><div class="msg" id="m" aria-live="polite"></div><div class="stars" id="s" aria-label="Bintang"></div></section>
</main>
<script src="/art.js"></script>
<script>const K=['apple','banana','strawberry','orange','grape'];let n=0;
const b=document.getElementById('b'),o=document.getElementById('o'),m=document.getElementById('m'),s=document.getElementById('s');
function baru(){
  n=1+Math.floor(Math.random()*10);const k=K[Math.floor(Math.random()*K.length)];
  b.className='fruits';b.innerHTML=Array.from({length:n},(_,i)=>ART[k].replace('<svg','<svg style="--i:'+i+'"')).join('');
  m.textContent='';
  const p=new Set([n]);while(p.size<3)p.add(1+Math.floor(Math.random()*10));
  o.innerHTML='';[...p].sort(()=>Math.random()-.5).forEach((v,i)=>{
    const x=document.createElement('button');x.className='opt';x.textContent=v;x.style.setProperty('--i',i);
    x.onclick=()=>{
      if(v===n){
        window.HP&&(HP.ok(),HP.say(String(n)));b.className='fruits hore';m.textContent='Pintar! '+n;
        [...o.children].forEach(c=>c.disabled=true);x.classList.add('benar');
        s.insertAdjacentHTML('beforeend',ART.star);setTimeout(baru,1700);
      }else{
        window.HP&&HP.no();m.textContent='Coba lagi ya';x.style.opacity=.35;
        x.classList.remove('salah');void x.offsetWidth;x.classList.add('salah');
      }
    };
    o.appendChild(x)});
}
baru();</script>
<script src="/hive.js" defer></script></body></html>
