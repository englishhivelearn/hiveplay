<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Count the Fruits · Hive Play</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hive.css"></head><body>
<div class="top"><a class="back" href="/">← Back</a></div>
<main>
<h1 class="rise">How many?</h1>
<p class="sub rise" style="--i:1">Count the fruits, then pick the right number.</p>
<div class="hv-bar"><div id="picker"></div><div id="note" class="hv-note" hidden></div></div>
<section class="stage rise" style="--i:2"><div class="fruits" id="b"></div><div class="opts" id="o"></div><div class="msg" id="m" aria-live="polite"></div><div class="stars" id="s" aria-label="Stars"></div></section></main>
<script src="/art.js"></script>
<script src="/hive-vocab.js"></script>
<script>const GAME='count-fruits';
/* Kata bawaan: dipakai hanya bila perpustakaan kosakata tidak tersedia. */
const FALLBACK=[{word:'apple',plural:'apples',art:'apple'},{word:'banana',plural:'bananas',art:'banana'},{word:'strawberry',plural:'strawberries',art:'strawberry'},{word:'orange',plural:'oranges',art:'orange'},{word:'grape',plural:'grapes',art:'grape'}];
const $=id=>document.getElementById(id);
const b=$('b'),o=$('o'),m=$('m'),s=$('s');
let words=[],imgs=[],star=ART.star,n=0,fr='',run=0;
async function mulai(setId){
  const my=++run;
  const res=await HiveVocab.load({game:GAME,category:'fruits',set:setId||'',fallback:FALLBACK,limit:20});
  const loaded=await Promise.all(res.words.map(async w=>(res.source==='library'?await HiveVocab.svg(w,['whole','character']):ART[w.art])||HiveVocab.placeholder(w.word)));
  const st=res.source==='library'?await HiveVocab.assetSvg('object.star'):null;
  if(my!==run)return;
  words=res.words;imgs=loaded;star=st||ART.star;s.textContent='';
  HiveVocab.notice($('note'),res);baru();
}
function baru(){
  n=1+Math.floor(Math.random()*10);const k=Math.floor(Math.random()*words.length),w=words[k];
  fr=n===1?w.word.toLowerCase():(w.plural||w.word.toLowerCase()+'s');
  b.className='fruits';b.innerHTML=Array.from({length:n},(_,i)=>imgs[k].replace('<svg','<svg style="--i:'+i+'"')).join('');
  m.textContent='';
  const p=new Set([n]);while(p.size<3)p.add(1+Math.floor(Math.random()*10));
  o.innerHTML='';[...p].sort(()=>Math.random()-.5).forEach((v,i)=>{
    const x=document.createElement('button');x.className='opt';x.textContent=v;x.style.setProperty('--i',i);
    x.onclick=()=>{
      if(v===n){
        window.HP&&(HP.ok(),HP.say(numWord(n)+' '+fr));b.className='fruits hore';m.textContent='Great job! '+n+' '+fr+'.';
        [...o.children].forEach(c=>c.disabled=true);x.classList.add('benar');
        s.insertAdjacentHTML('beforeend',star);setTimeout(baru,2000);
      }else{
        window.HP&&HP.no();m.textContent='Try again!';x.style.opacity=.35;
        x.classList.remove('salah');void x.offsetWidth;x.classList.add('salah');
      }
    };
    o.appendChild(x)});
}
HiveVocab.picker($('picker'),{game:GAME,category:'fruits',onChange:mulai}).then(mulai);</script>
<script src="/hive.js" defer></script></body></html>
